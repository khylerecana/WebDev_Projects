<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khyle Recaña | Gallery</title>
    <meta name="description" content="Achievements and milestones from the portfolio of Khyle Recaña.">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="static/images/Logo.svg">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

    <script>
        if (new URLSearchParams(location.search).has('embed')) document.documentElement.classList.add('is-embed');
    </script>
</head>

<body>

    <div class="container-fluid bento-wrap">
        <div class="bento">
            <div class="row g-0">

                <!-- Columns 1–3 -->
                <div class="col-9">
                    <div class="row g-0">

                        <!-- Column 1 -->
                        <div class="col-4">
                            <div class="p-1">
                                <div class="card bx-3">
                                    <div class="bento-slot">
                                        <i class="bi bi-image"></i>
                                        <span>Image 01</span>
                                    </div>
                                    <img class="bento-img" src="assets/1.png" alt="Bento image 1"
                                        onerror="this.remove()">
                                </div>
                            </div>
                            <div class="p-1">
                                <div class="card bx-2">
                                    <div class="bento-slot">
                                        <i class="bi bi-image"></i>
                                        <span>Image 06</span>
                                    </div>
                                    <img class="bento-img" src="assets/6.png" alt="Bento image 6"
                                        onerror="this.remove()">
                                </div>
                            </div>
                        </div>

                        <!-- Columns 2–3 -->
                        <div class="col-8">
                            <div class="row g-0">
                                <div class="col-6">
                                    <div class="p-1">
                                        <div class="card bx-2">
                                            <div class="bento-slot">
                                                <i class="bi bi-image"></i>
                                                <span>Image 02</span>
                                            </div>
                                            <img class="bento-img" src="assets/2.png"
                                                alt="Bento image 2" onerror="this.remove()">
                                        </div>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="p-1">
                                        <div class="card bx-2">
                                            <div class="bento-slot">
                                                <i class="bi bi-image"></i>
                                                <span>Image 03</span>
                                            </div>
                                            <img class="bento-img" src="assets/3.png"
                                                alt="Bento image 3" onerror="this.remove()">
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="p-1">
                                <div class="card bx-3 bx-feature">
                                    <div class="bento-slot">
                                        <i class="bi bi-image"></i>
                                        <span>Image 05</span>
                                    </div>
                                    <img class="bento-img" src="assets/5.png" alt="Bento image 5"
                                        onerror="this.remove()">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Bottom row -->
                    <div class="row g-0">
                        <div class="col-8">
                            <div class="p-1">
                                <div class="card bx-2">
                                    <div class="bento-slot">
                                        <i class="bi bi-image"></i>
                                        <span>Image 08</span>
                                    </div>
                                    <img class="bento-img" src="assets/8.jpg" alt="Bento image 8"
                                        onerror="this.remove()">
                                </div>
                            </div>
                        </div>
                        <div class="col-4">
                            <div class="p-1">
                                <div class="card bx-2">
                                    <div class="bento-slot">
                                        <i class="bi bi-image"></i>
                                        <span>Image 09</span>
                                    </div>
                                    <img class="bento-img" src="assets/9.png" alt="Bento image 9"
                                        onerror="this.remove()">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Column 4 -->
                <div class="col-3">
                    <div class="p-1">
                        <div class="card bx-3">
                            <div class="bento-slot">
                                <i class="bi bi-image"></i>
                                <span>Image 04</span>
                            </div>
                            <img class="bento-img" src="assets/4.png" alt="Bento image 4"
                                onerror="this.remove()">
                        </div>
                    </div>
                    <div class="p-1">
                        <div class="card bx-4">
                            <div class="bento-slot">
                                <i class="bi bi-image"></i>
                                <span>Image 07</span>
                            </div>
                            <img class="bento-img" src="assets/7.png" alt="Bento image 7"
                                onerror="this.remove()">
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        // Cursor spotlight on bento boxes
        if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            document.querySelectorAll('.bento .card').forEach(card => {
                card.addEventListener('mousemove', (e) => {
                    const rect = card.getBoundingClientRect();
                    card.style.setProperty('--spot-x', `${((e.clientX - rect.left) / rect.width) * 100}%`);
                    card.style.setProperty('--spot-y', `${((e.clientY - rect.top) / rect.height) * 100}%`);
                    card.style.setProperty('--spot-opacity', '1');
                });
                card.addEventListener('mouseleave', () => card.style.setProperty('--spot-opacity', '0'));
            });
        }
    </script>

</body>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"

</html>
