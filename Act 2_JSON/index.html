    <script>
        function escapeHtml(value) {
            var div = document.createElement("div");
            div.textContent = value;
            return div.innerHTML;
        }

        function listItems(items) {
            return items.map(function (item) {
                return "<li>" + escapeHtml(item) + "</li>";
            }).join("");
        }

        // Career card layout functions
        function careerColumn(career) {
            var id = escapeHtml(career.id);
            var title = escapeHtml(career.title);
            var icon = escapeHtml(career.icon);

            return `
                        <div class="col-12 col-md-6 col-lg-4 career-col" id="col-${id}">
                            <div class="career-flip" id="career-${id}" role="button" tabindex="0" aria-pressed="false" aria-label="${title}. Flip card for details.">
                                <div class="career-flip-inner">
                                    <article class="card career-card career-front" id="front-${id}" aria-hidden="false">
                                        <div class="card-body">
                                            <i class="bi ${icon} career-watermark" aria-hidden="true"></i>
                                            <div class="career-top">
                                                <span class="career-icon"><i class="bi ${icon}" aria-hidden="true"></i></span>
                                                <span class="career-track">${escapeHtml(career.track)}</span>
                                            </div>
                                            <h3 class="career-title">${title}</h3>
                                            <p class="career-desc">${escapeHtml(career.description)}</p>
                                            <ul class="career-skills">${listItems(career.skills)}</ul>
                                            <span class="career-hint"><i class="bi bi-arrow-repeat" aria-hidden="true"></i> Flip card</span>
                                        </div>
                                    </article>
                                    <article class="card career-card career-back" id="back-${id}" aria-hidden="true">
                                        <div class="card-body">
                                            <h3 class="career-title career-back-title">${title}</h3>
                                            <h4 class="career-label">What you'll do</h4>
                                            <p class="career-desc career-overview">${escapeHtml(career.overview)}</p>
                                            <h4 class="career-label">Tools you'll use</h4>
                                            <ul class="career-skills career-tools">${listItems(career.tools)}</ul>
                                            <h4 class="career-label">Training and certifications</h4>
                                            <ul class="career-training">${listItems(career.training)}</ul>
                                            <span class="career-hint"><i class="bi bi-arrow-repeat" aria-hidden="true"></i> Flip back</span>
                                        </div>
                                    </article>
                                </div>
                            </div>
                        </div>`;
        }

        function careerLayout(careers) {
            return `
                <div class="container-fluid px-0" id="careers-container">
                    <div class="row g-3 career" id="careers-row">${careers.map(careerColumn).join("")}
                    </div>
                </div>`;
        }

        function toggleFlip(flip) {
            var flipped = !flip.classList.contains("is-flipped");
            flip.classList.toggle("is-flipped", flipped);
            flip.setAttribute("aria-pressed", String(flipped));
            flip.querySelector(".career-front").setAttribute("aria-hidden", String(flipped));
            flip.querySelector(".career-back").setAttribute("aria-hidden", String(!flipped));
        }

        function bindFlip(row) {
            row.addEventListener("click", function (event) {
                var flip = event.target.closest(".career-flip");
                if (flip) toggleFlip(flip);
            });

            row.addEventListener("keydown", function (event) {
                if (event.key !== "Enter" && event.key !== " ") return;
                var flip = event.target.closest(".career-flip");
                if (!flip) return;
                event.preventDefault();
                toggleFlip(flip);
            });
        }

        function bindSpotlight(row) {
            row.addEventListener("pointermove", function (event) {
                var card = event.target.closest(".card");
                if (!card) return;
                var rect = card.getBoundingClientRect();
                card.style.setProperty("--spot-x", event.clientX - rect.left + "px");
                card.style.setProperty("--spot-y", event.clientY - rect.top + "px");
                card.style.setProperty("--spot-opacity", "1");
            });

            row.addEventListener("pointerout", function (event) {
                var card = event.target.closest(".card");
                if (card && !card.contains(event.relatedTarget)) {
                    card.style.setProperty("--spot-opacity", "0");
                }
            });
        }

        function renderCareers(targetId, dataId) {
            var target = document.getElementById(targetId || "careers-root");
            var data = JSON.parse(document.getElementById(dataId || "careers-data").textContent);

            target.innerHTML = careerLayout(data.careers);

            var row = document.getElementById("careers-row");
            bindFlip(row);
            bindSpotlight(row);
        }

        renderCareers("careers-root", "careers-data");
    </script>
