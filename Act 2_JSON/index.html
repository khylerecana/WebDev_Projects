    <script>
        (function () {
            var data = JSON.parse(document.getElementById("careers-data").textContent);
            var row = document.getElementById("careers-row");
            var template = document.getElementById("careers-col");

            function fillList(list, items) {
                items.forEach(function (text) {
                    var li = document.createElement("li");
                    li.textContent = text;
                    list.appendChild(li);
                });
            }

            function setFlipped(flip, flipped) {
                flip.classList.toggle("is-flipped", flipped);
                flip.setAttribute("aria-pressed", String(flipped));
                flip.querySelector(".career-front").setAttribute("aria-hidden", String(flipped));
                flip.querySelector(".career-back").setAttribute("aria-hidden", String(!flipped));
            }

            data.careers.forEach(function (career) {
                var col = template.cloneNode(true);
                col.id = "col-" + career.id;

                var flip = col.querySelector(".career-flip");
                flip.id = "career-" + career.id;
                flip.setAttribute("aria-label", career.title + ". Flip card for details.");

                var front = flip.querySelector(".career-front");
                front.id = "front-" + career.id;
                front.querySelector(".career-icon i").classList.add(career.icon);
                front.querySelector(".career-watermark").classList.add(career.icon);
                front.querySelector(".career-track").textContent = career.track;
                front.querySelector(".career-title").textContent = career.title;
                front.querySelector(".career-desc").textContent = career.description;
                fillList(front.querySelector(".career-skills"), career.skills);

                var back = flip.querySelector(".career-back");
                back.id = "back-" + career.id;
                back.querySelector(".career-back-title").textContent = career.title;
                back.querySelector(".career-overview").textContent = career.overview;
                fillList(back.querySelector(".career-tools"), career.tools);
                fillList(back.querySelector(".career-training"), career.training);

                setFlipped(flip, false);
                row.appendChild(col);
            });

            row.removeChild(template);

            row.addEventListener("click", function (event) {
                var flip = event.target.closest(".career-flip");
                if (flip) setFlipped(flip, !flip.classList.contains("is-flipped"));
            });

            row.addEventListener("keydown", function (event) {
                if (event.key !== "Enter" && event.key !== " ") return;
                var flip = event.target.closest(".career-flip");
                if (!flip) return;
                event.preventDefault();
                setFlipped(flip, !flip.classList.contains("is-flipped"));
            });

            row.addEventListener("pointermove", function (event) {
                var card = event.target.closest(".card");
                if (!card) return;
                var rect = card.getBoundingClientRect();
                card.style.setProperty("--spot-x", event.clientX - rect.left + "px");
                card.style.setProperty("--spot-y", event.clientY - rect.top + "px");
                card.style.setProperty("--spot-opacity", "1");
            });

            row.addEventListener("pointerout", function (event) {
                var card = event.target.closest(".card");
                if (card && !card.contains(event.relatedTarget)) {
                    card.style.setProperty("--spot-opacity", "0");
                }
            });
        })();
